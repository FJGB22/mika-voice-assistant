[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mika"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["google-genai"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mika = "mika.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]